[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wotshop"
version = "0.1.0"
description = "WOTSHOP — магазин перепродаж аккаунтов Мир Танков, World Of Tanks, Tanks Blitz"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.29.0",
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.43",
]

[project.scripts]
wot-shop = "src.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src"]
