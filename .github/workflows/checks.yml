name: Checks

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen
      - run: uv run python -m compileall -q src
      - run: docker compose config --quiet